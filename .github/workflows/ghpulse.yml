name: ghpulse

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ghpulse.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ghpulse
        env:
          GHPULSE_VERSION: ${{ vars.GHPULSE_VERSION || 'latest' }}
        run: curl -fsSL https://raw.githubusercontent.com/QaidVoid/ghpulse/main/install.sh | bash

      - name: Render every scene
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p output

          # Collect from the API once, then render offline from the cache so a
          # full refresh costs a single pass over the API.
          ghpulse --dump-json stats.json --scene void --scene-dir scenes \
            --title "QaidVoid" --output output
          ghpulse --from-json stats.json --scene void --scene-dir scenes \
            --title "QaidVoid" --light --output output

          # The shipped scenes too, so the README can swap to any of them.
          for scene in $(ghpulse --list-scenes); do
            ghpulse --from-json stats.json --scene "$scene" --output output
            ghpulse --from-json stats.json --scene "$scene" --light --output output
          done

          ls -la output

      - name: Publish SVGs to ghpulse-output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Stash the freshly generated SVGs.
          mkdir -p /tmp/ghpulse-out
          cp output/*.svg /tmp/ghpulse-out/

          git config user.name "ghpulse[bot]"
          git config user.email "ghpulse[bot]@users.noreply.github.com"

          # Switch to the publish branch (orphan it on first run).
          if git ls-remote --exit-code --heads origin ghpulse-output >/dev/null 2>&1; then
            git fetch origin ghpulse-output
            git checkout ghpulse-output
            find . -maxdepth 1 -name '*.svg' -delete
          else
            git checkout --orphan ghpulse-output
            git rm -rf . >/dev/null 2>&1 || true
          fi

          cp /tmp/ghpulse-out/*.svg .
          git add ./*.svg

          if git diff --cached --quiet; then
            echo "no SVG changes, nothing to publish"
            exit 0
          fi

          git commit -m "chore: refresh ghpulse stats"
          git push origin ghpulse-output
